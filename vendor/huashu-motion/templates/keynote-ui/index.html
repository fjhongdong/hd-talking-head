<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"eyebrow","type":"string","label":"眉题（标题上方小字）","default":"全 新 发 布","group":"标题"},
  {"id":"title","type":"string","label":"主标题（≤6 个字或一个产品名）","default":"参数化动画片段","group":"标题"},
  {"id":"subtitle","type":"string","label":"副标题（一句话 ≤16 字）","default":"一份 JSON，出一段时长精确的动画","group":"标题"},
  {"id":"card1Title","type":"string","label":"卡片 1 标题（清空就不出现）","default":"8 种动画语法","group":"功能卡"},
  {"id":"card1Sub","type":"string","label":"卡片 1 说明","default":"从 3Blue1Brown 到动态文字","group":"功能卡"},
  {"id":"card1Icon","type":"enum","label":"卡片 1 图标","default":"layers","options":[{"value":"layers"},{"value":"wave"},{"value":"memory"},{"value":"agent"},{"value":"clock"},{"value":"phone"},{"value":"chart"},{"value":"code"},{"value":"check"},{"value":"play"},{"value":"bolt"},{"value":"lock"},{"value":"none","label":"不画图标（画编号）"}],"group":"功能卡"},
  {"id":"card2Title","type":"string","label":"卡片 2 标题（清空就不出现）","default":"时长精确到帧","group":"功能卡"},
  {"id":"card2Sub","type":"string","label":"卡片 2 说明","default":"帧数 = 时长 × 帧率","group":"功能卡"},
  {"id":"card2Icon","type":"enum","label":"卡片 2 图标","default":"clock","options":[{"value":"layers"},{"value":"wave"},{"value":"memory"},{"value":"agent"},{"value":"clock"},{"value":"phone"},{"value":"chart"},{"value":"code"},{"value":"check"},{"value":"play"},{"value":"bolt"},{"value":"lock"},{"value":"none","label":"不画图标（画编号）"}],"group":"功能卡"},
  {"id":"card2Value","type":"number","label":"卡片 2 上计数的数字","default":30,"step":"any","group":"功能卡"},
  {"id":"card2Suffix","type":"string","label":"卡片 2 数字后缀（要空格自己写）","default":" fps","group":"功能卡"},
  {"id":"card2Label","type":"string","label":"卡片 2 数字下的小字","default":"默认帧率","group":"功能卡"},
  {"id":"card3Title","type":"string","label":"卡片 3 标题（清空就不出现）","default":"横竖屏都能出","group":"功能卡"},
  {"id":"card3Sub","type":"string","label":"卡片 3 说明","default":"竖屏自动换一套排版","group":"功能卡"},
  {"id":"card3Icon","type":"enum","label":"卡片 3 图标","default":"phone","options":[{"value":"layers"},{"value":"wave"},{"value":"memory"},{"value":"agent"},{"value":"clock"},{"value":"phone"},{"value":"chart"},{"value":"code"},{"value":"check"},{"value":"play"},{"value":"bolt"},{"value":"lock"},{"value":"none","label":"不画图标（画编号）"}],"group":"功能卡"},
  {"id":"numberValue","type":"number","label":"大数字（说到它时落定）","default":7.8,"step":"any","group":"大数字"},
  {"id":"numberDecimals","type":"number","label":"大数字小数位","default":1,"min":0,"max":4,"step":1,"group":"大数字"},
  {"id":"numberPrefix","type":"string","label":"大数字前缀（如 ¥）","default":"","group":"大数字"},
  {"id":"numberSuffix","type":"string","label":"大数字后缀（要空格自己写）","default":" 倍","group":"大数字"},
  {"id":"numberCaption","type":"string","label":"大数字说明（虚构数据写明示意）","default":"示例公司五个财年的营收涨幅（示意数据）","group":"大数字"},
  {"id":"shotTitle","type":"string","label":"截图卡标题（清空就不出现）","default":"用 t3 财经图表出的一帧","group":"截图卡"},
  {"id":"shotSub","type":"string","label":"截图卡说明","default":"示意数据：公司与数字均为虚构","group":"截图卡"},
  {"id":"shotImage","type":"string","label":"截图路径（放进 assets/，相对 index.html）","default":"assets/chart.png","group":"截图卡"},
  {"id":"highlightRect","type":"string","label":"截图上框出的一块（JSON [x, y, 宽, 高]，相对截图 0–1；清空不框）","default":"[0.648, 0.245, 0.104, 0.105]","group":"截图卡"},
  {"id":"accent","type":"color","label":"强调色（步骤号、框）","default":"#3d6bff","group":"颜色"},
  {"id":"duration","type":"number","label":"片长（秒；有配音时至少到配音结束）","default":10,"min":2,"max":120,"step":0.5,"group":"节奏"},
  {"id":"pace","type":"number","label":"节奏倍率（1 原速；发布会一屏常 5–8 秒，真片常用 1.5–2.5）","default":1,"min":0.5,"max":4,"step":0.1,"group":"节奏"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>huashu-motion · 发布会界面</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050508; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050508; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  发布会界面（t2）：深色光斑底，一屏一件事；字从模糊里浮出，卡片是毛玻璃、轻回弹落位；截图放进玻璃卡、框出一块；大数字单独一屏。
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: t2_keynote_ui, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows (a number cue's `at` is when it lands; it starts counting 0.9 s earlier); `word` anchors it to that word of
    the narration once `om voice` has run (skills/huashu-motion/references/grammars.md).
  - Consecutive cards without an image share one screen (up to 3); a card with `image` gets a screen of its own.
  - Pickable regions (0-based like the spec): title · card-<i> (i-th card/step/image cue) · number-<k> · highlight-<k>.
  - Scenes: title → cards-1 → number-1 → screenshot-1 → highlight-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="stage" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "t2_keynote_ui",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "eyebrow": "{{eyebrow}}", "title": "{{title}}", "subtitle": "{{subtitle}}", "accent": "{{accent}}" },
  "cues": [
    { "at": 0.0, "kind": "title" },
    { "at": 2.2, "kind": "card", "word": "语法", "text": "{{card1Title}}", "sub": "{{card1Sub}}", "data": { "icon": "{{card1Icon}}" } },
    { "at": 3.0, "kind": "card", "word": "帧", "text": "{{card2Title}}", "sub": "{{card2Sub}}", "data": { "icon": "{{card2Icon}}", "value": "{{card2Value}}", "suffix": "{{card2Suffix}}", "label": "{{card2Label}}" } },
    { "at": 3.8, "kind": "card", "word": "竖屏", "text": "{{card3Title}}", "sub": "{{card3Sub}}", "data": { "icon": "{{card3Icon}}" } },
    { "at": 6.0, "kind": "number", "word": "7.8", "text": "{{numberCaption}}", "data": { "value": "{{numberValue}}", "decimals": "{{numberDecimals}}", "prefix": "{{numberPrefix}}", "suffix": "{{numberSuffix}}" } },
    { "at": 7.2, "kind": "card", "word": "一帧", "text": "{{shotTitle}}", "sub": "{{shotSub}}", "image": "{{shotImage}}" },
    { "at": 8.4, "kind": "highlight", "word": "倍", "data": { "rect": "{{highlightRect|json}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/t2_keynote_ui.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      for (const q of spec.cues) {
        if (q.data && q.data.icon === 'none') delete q.data.icon;
        if (q.data && q.data.label === '') delete q.data.label;
        if (q.kind === 'card' && 'image' in q && !q.image) delete q.image;   // no screenshot path → a plain feature card
      }
      // the box sits on a screenshot: drop it when there is no screenshot card or no rect
      const hasShot = spec.cues.some((q) => q.image);
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || (hasShot && Array.isArray(q.data && q.data.rect) && q.data.rect.length === 4));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
