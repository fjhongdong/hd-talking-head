const{clamp,prog,E}=L;let SRC;const W=1080,H=1920;const cv=()=>{const[c,g]=L.canvas(W,H,2);c.style.width=W+'px';c.style.height=H+'px';return[c,g]},p=(t,a,b)=>E.outCubic(clamp(prog(t,a,b)));async function build(){Object.assign(view.style,{width:W+'px',height:H+'px'});Object.assign(cam.style,{width:W+'px',height:H+'px'});SRC=await L.loadImg(CFG.source);window.READY=true}
function render(t){const[c,g]=cv();g.drawImage(SRC,0,0,W,H);const R=[{y:390,h:135},{y:675,h:135},{y:945,h:135}];if(t>=.42&&t<5.05){g.fillStyle='#f4f3ef';R.forEach(r=>g.fillRect(80,r.y-10,760,r.h+20));g.strokeStyle='rgba(186,183,177,.7)';g.lineWidth=2;[193,461,730,999].forEach(x=>{g.beginPath();g.moveTo(x,193);g.lineTo(x,1690);g.stroke()});[193,461,730,999].forEach(y=>{g.beginPath();g.moveTo(98,y);g.lineTo(983,y);g.stroke()});R.forEach((r,i)=>{const b=[.55,1.55,2.55][i],q=p(t,b,b+.62),s=p(t,b+.62,b+1.08),dy=(i===0?-18:i===1?-15:-20)*q+(i===0?18:i===1?15:20)*s,dx=(i===1?-10:8)*q;const part=L.crop(SRC,80,r.y,760,r.h,2);g.save();g.translate(dx,dy);g.drawImage(part,80,r.y,760,r.h);g.restore();g.fillStyle='#ff5a00';g.fillRect(338,r.y+82,48+64*q,5)});const path=p(t,.48,3.72),sw=p(t,3.58,4.28),loc=p(t,3.9,4.42);g.strokeStyle='#ff5a00';g.lineWidth=7;g.beginPath();g.moveTo(338,474);g.lineTo(338,474+path*570);g.lineTo(338+sw*494,1044);g.stroke();g.fillStyle='#ff5a00';g.fillRect(392-8*loc,1146-5*loc,222+16*loc,114+10*loc);g.fillStyle='#fff';g.font='700 64px Arial';g.fillText('本地',410-6*loc,1222+6*loc);g.fillStyle='#ff5a00';const im=clamp((t-3.9)/.35)*clamp((4.42-t)/.35);for(let k=0;k<8;k++){const a=k*2.4;g.globalAlpha=im*.5;g.fillRect(480+Math.cos(a)*80*im,1198+Math.sin(a)*65*im,6,6)}g.globalAlpha=1}if(t>4.65){g.globalAlpha=clamp((t-4.65)/.4);g.drawImage(SRC,0,0,W,H);g.globalAlpha=1}cam.replaceChildren(c)}window.render=render;build();</script></body></html>
